[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apctt-server"
version = "0.5.0"
description = "APCTT assessment API server — development kit (not an official event release)"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["apctt_*"]

[tool.setuptools.package-data]
"*" = ["static/**/*"]

[tool.pytest.ini_options]
# GPU tests (tests/cuda) run separately on a CUDA host; they are not default test paths.
testpaths = [
    "tests/contract", "tests/api", "tests/runtime", "tests/diagnostics",
    "tests/integration", "tests/security", "tests/release", "tests/cuda_unit",
    "tests/stage2_example", "tests/licensing", "tests/team_tools", "tests/hq",
]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S603", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"participant_example/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
